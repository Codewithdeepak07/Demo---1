# Redis is a disposable cache in this project.
# If it is flushed, nothing breaks - the system is only slower.
# So persistence is switched OFF on purpose and no volume is mounted.

bind 0.0.0.0
port 6379
protected-mode no

# no RDB snapshots and no append-only file
save ""
appendonly no

# keep memory bounded, evict least recently used keys first
maxmemory 256mb
maxmemory-policy allkeys-lru
